<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Radar - Blankenhagen Spieleentwicklung</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: system-ui, -apple-system, sans-serif; 
            background: #121212; 
            color: white; 
            text-align: center;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background: #1a1a1a;
            padding: 8px 10px;
            border-bottom: 2px solid #00e5ff;
            flex-shrink: 0;
        }
        header h2 {
            font-size: clamp(14px, 3.5vw, 18px);
            color: #00e5ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        header p {
            font-size: clamp(10px, 2.2vw, 12px);
            color: #aaa;
            font-weight: bold;
        }

        .screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            flex: 1;
            padding: 10px; 
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        #gameScreen, #cameraScreen, #success { display: none; }

        button { 
            padding: 12px 20px; 
            font-size: clamp(14px, 3.5vw, 16px); 
            margin: 8px; 
            cursor: pointer; 
            background: #00e5ff; 
            border: none; 
            font-weight: bold; 
            color: #000; 
            border-radius: 6px;
            touch-action: manipulation;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #00e5ff;
            background: #111;
            color: #fff;
            border-radius: 4px;
            width: 90%;
            max-width: 280px;
            text-align: center;
            margin: 6px 0;
        }

        #radar { 
            width: min(65vw, 45vh, 260px); 
            height: min(65vw, 45vh, 260px); 
            border-radius: 50%; 
            border: 2px solid #00e5ff; 
            position: relative; 
            margin: 15px auto; 
            overflow: hidden; 
            background: rgba(0,229,255,0.05); 
            flex-shrink: 0;
        }
        #sweep, #sweepGlow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; pointer-events: none; }
        #sweep { background: conic-gradient(from 0deg, rgba(0,229,255,0.4), transparent 60deg); }
        
        #target { 
            width: 16px; 
            height: 16px; 
            background: #ffff00; 
            border-radius: 50%; 
            position: absolute; 
            transform: translate(-50%, -50%); 
            top: 50%; 
            left: 50%; 
            box-shadow: 0 0 12px #ffff00, 0 0 24px #ffff00; 
            opacity: 0; 
            transition: opacity 0.8s ease-out; 
        }
        
        video { width: 100%; max-width: 350px; height: 280px; border-radius: 8px; background: #222; object-fit: cover; }
        
        .control-panel { 
            background: #222; 
            border: 1px solid #444; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            width: 100%; 
            font-size: 13px;
        }
        
        .info-text { font-size: clamp(13px, 3vw, 15px); margin: 4px 0; }
        #searchStatus { font-size: 11px; color: #00e5ff; margin-top: 4px; min-height: 16px; }
    </style>
</head>
<body>

    <header>
        <h2>Blankenhagen Spieleentwicklung</h2>
        <p>Prototyp Test – GPS Radar</p>
    </header>

    <!-- START-BILDSCHIRM -->
    <div id="startScreen" class="screen">
        <h1 style="font-size: clamp(18px, 4vw, 24px); margin-bottom: 15px;">GPS RADAR PROTOTYP</h1>
        
        <div class="control-panel" style="max-width: 340px;">
            <strong style="color: #00e5ff; font-size: 14px;">🏠 ZIELADRESSE EINGEBEN</strong><br>
            <span style="color: #ccc; font-size: 11px;">(Optionale Zieladresse):</span>
            
            <div style="margin: 8px 0;">
                <input type="text" id="addressInput" placeholder="z. B. Marktplatz 1, Plochingen"><br>
                <button type="button" id="btnSearchAddress" style="padding: 6px 12px; font-size: 12px; margin-top: 4px;">ADRESSE SUCHEN</button>
            </div>
            
            <div id="searchStatus"></div>
        </div>

        <button id="startButton">SPIEL & KAMERA STARTEN</button>
    </div>

    <!-- SPIEL-BILDSCHIRM -->
    <div id="gameScreen" class="screen">
        <div id="status" style="font-weight: bold; color: #00e5ff; font-size: 16px; margin-bottom: 10px;">🔎 ZIEL SUCHEN</div>
        
        <div id="radar">
            <div id="sweep"></div>
            <div id="sweepGlow"></div>
            <div id="target"></div>
        </div>

        <div class="info-text">Entfernung: <span id="distance" style="font-weight: bold; color: #00e5ff;">-</span> m</div>
        <div class="info-text" id="accuracy">GPS-Genauigkeit: -</div>
        <div class="info-text" id="bearing">Zielrichtung: -</div>
        
        <button id="cameraButton" style="background: #00ff66; margin-top: 15px;">KAMERA ÖFFNEN</button>
    </div>

    <!-- KAMERA-BILDSCHIRM -->
    <div id="cameraScreen" class="screen">
        <h3 id="cameraHeaderTitle" style="color: #00e5ff; margin-bottom: 10px;">📷 KAMERA-SUCHE</h3>
        <video id="camera" autoplay playsinline muted></video>
        <div style="margin-top: 10px;">
            <button id="foundButton" style="background: #00ff66;">ZIEL GEFUNDEN</button>
            <button id="closeCameraButton" style="background: #ff5252; color: #fff;">KAMERA SCHLIESSEN</button>
        </div>
    </div>

    <!-- ERFOLGS-BILDSCHIRM -->
    <div id="success" class="screen">
        <h1 style="color: #00ff66; font-size: clamp(20px, 5vw, 28px); margin-bottom: 10px;">HERZLICHEN GLÜCKWUNSCH!</h1>
        <p style="margin-bottom: 15px; font-size: 14px;">Du hast das Ziel erfolgreich erreicht.</p>
        <button id="again">NOCH EINMAL</button>
    </div>

<script>
let TARGET_LAT = null;
let TARGET_LON = null;
let TARGET_NAME = "";
const SPAWN_DISTANCE_METERS = 25;
const TARGET_RADIUS = 5; 
const RADAR_RANGE = 100;

let latitude = null; 
let longitude = null;
let accuracy = 0;      
let targetBearing = 0;
let heading = 0;
let cameraStream = null;
let sweepAngle = 0;
let radarAnimation = null;
let targetAngleRelative = 0;
let hasPinged = false;

let audioCtx = null;

function playSonarPing() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(1240, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
    } catch (e) {
        console.log("Audio blockiert.");
    }
}

const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const cameraScreen = document.getElementById("cameraScreen");
const success = document.getElementById("success");

const startButton = document.getElementById("startButton");
const cameraButton = document.getElementById("cameraButton");
const closeCameraButton = document.getElementById("closeCameraButton");
const foundButton = document.getElementById("foundButton");
const againButton = document.getElementById("again");

const status = document.getElementById("status");
const distanceOutput = document.getElementById("distance");
const accuracyOutput = document.getElementById("accuracy");
const bearingOutput = document.getElementById("bearing");
const cameraHeaderTitle = document.getElementById("cameraHeaderTitle");

const target = document.getElementById("target");
const radar = document.getElementById("radar");
const sweep = document.getElementById("sweep");
const sweepGlow = document.getElementById("sweepGlow");
const camera = document.getElementById("camera");

document.getElementById("btnSearchAddress").addEventListener("click", searchAddress);

async function searchAddress() {
    const address = document.getElementById("addressInput").value.trim();
    const searchStatus = document.getElementById("searchStatus");

    if (!address) {
        searchStatus.style.color = "#ff5252";
        searchStatus.textContent = "Bitte eine Adresse eingeben.";
        return;
    }

    searchStatus.style.color = "#00e5ff";
    searchStatus.textContent = "Adresse wird gesucht...";

    try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data && data.length > 0) {
            TARGET_LAT = parseFloat(data[0].lat);
            TARGET_LON = parseFloat(data[0].lon);
            TARGET_NAME = data[0].display_name.split(',')[0] + ", " + (data[0].display_name.split(',')[1] || "");

            searchStatus.style.color = "#00ff66";
            searchStatus.textContent = "✓ Gefunden: " + TARGET_NAME;
        } else {
            searchStatus.style.color = "#ff5252";
            searchStatus.textContent = "Adresse nicht gefunden. Bitte genauer eingeben.";
        }
    } catch (err) {
        searchStatus.style.color = "#ff5252";
        searchStatus.textContent = "Fehler bei der Adressabfrage.";
    }
}

function setDynamicTarget(userLat, userLon) {
    const metersPerDegree = 111000;
    const latOffset = SPAWN_DISTANCE_METERS / metersPerDegree;
    const lonOffset = SPAWN_DISTANCE_METERS / (metersPerDegree * Math.cos(userLat * Math.PI / 180));

    TARGET_LAT = userLat + (latOffset * 0.7);
    TARGET_LON = userLon + (lonOffset * 0.7);
    TARGET_NAME = "Automatisches Testziel (25m)";
}

startButton.addEventListener("click", async () => {
    await initCameraStream();
    startGame();
});

async function initCameraStream() {
    try {
        if (!cameraStream) {
            // Rückkamera gezielt anfordern
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } },
                audio: false
            });
        }
    } catch (err) {
        try {
            // Fallback auf allgemeine Umgebungskamera
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
        } catch (e) {
            console.log("Kamera Vorab-Aktivierung Fehlgeschlagen:", e.message);
        }
    }
    if (cameraStream) {
        camera.srcObject = cameraStream;
    }
}

function startGame(){
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    startScreen.style.display = "none";
    gameScreen.style.display = "flex";

    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
            (pos) => {
                latitude = pos.coords.latitude;
                longitude = pos.coords.longitude;
                accuracy = Math.round(pos.coords.accuracy);
                
                if (TARGET_LAT === null) {
                    setDynamicTarget(latitude, longitude);
                }
                updateGame();
            },
            (err) => {
                alert("GPS konnte nicht abgerufen werden. Bitte Standort freigeben.");
            },
            { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
        );
    }

    if (window.DeviceOrientationEvent) {
        window.addEventListener("deviceorientation", (e) => {
            if (e.webkitCompassHeading) {
                heading = e.webkitCompassHeading;
            } else if (e.alpha) {
                heading = 360 - e.alpha;
            }
            updateRadar();
        }, true);
    }

    startRadar();
}

function updateGame(){
    if(latitude === null || longitude === null || TARGET_LAT === null || TARGET_LON === null) return;

    const distance = calculateDistance(latitude, longitude, TARGET_LAT, TARGET_LON);
    targetBearing = calculateBearing(latitude, longitude, TARGET_LAT, TARGET_LON);

    const distRounded = Math.round(distance);
    distanceOutput.textContent = distRounded;
    accuracyOutput.textContent = "GPS-Genauigkeit: ±" + accuracy + " m";
    bearingOutput.textContent = "Zielrichtung: " + Math.round(targetBearing) + "°";

    // Prüfe streng auf <= 5 Meter
    if(distance <= TARGET_RADIUS){
        status.textContent = "🎯 ZIELBEREICH ERREICHT";
        status.style.color = "#00ff66";
        
        cameraHeaderTitle.textContent = "🎯 ZIELBEREICH ERREICHT (" + distRounded + " m)";
        cameraHeaderTitle.style.color = "#00ff66";

        if (gameScreen.style.display !== "none") {
            openCamera();
        }
    } else {
        status.textContent = "🔎 ZIEL SUCHEN";
        status.style.color = "#00e5ff";

        cameraHeaderTitle.textContent = "📷 KAMERA-SUCHE (" + distRounded + " m)";
        cameraHeaderTitle.style.color = "#00e5ff";
    }

    updateRadar();
}

function updateRadar(){
    if(latitude === null || longitude === null || TARGET_LAT === null || TARGET_LON === null) return;

    const distance = calculateDistance(latitude, longitude, TARGET_LAT, TARGET_LON);
    const size = radar.clientWidth;
    const center = size / 2;

    let radius = (distance / RADAR_RANGE) * center;
    radius = Math.min(radius, center - 10);

    targetAngleRelative = normalize(targetBearing - heading);
    const radians = targetAngleRelative * Math.PI / 180;

    target.style.left = (center + Math.sin(radians) * radius) + "px";
    target.style.top = (center - Math.cos(radians) * radius) + "px";
}

function startRadar(){
    if(radarAnimation !== null){
        cancelAnimationFrame(radarAnimation);
        radarAnimation = null;
    }

    function animate(){
        sweepAngle += 2.08;
        if(sweepAngle >= 360) sweepAngle = 0;

        sweep.style.transform = "rotate(" + sweepAngle + "deg)";
        sweepGlow.style.transform = "rotate(" + sweepAngle + "deg)";

        let angleDiff = Math.abs(sweepAngle - targetAngleRelative);
        if (angleDiff > 180) angleDiff = 360 - angleDiff;

        if (angleDiff < 12) {
            target.style.opacity = "1";
            
            if (!hasPinged) {
                playSonarPing();
                hasPinged = true;
            }
        } else {
            target.style.opacity = "0";
            if (angleDiff > 30) {
                hasPinged = false;
            }
        }

        radarAnimation = requestAnimationFrame(animate);
    }
    animate();
}

cameraButton.addEventListener("click", openCamera);
closeCameraButton.addEventListener("click", closeCamera);

async function openCamera(){
    try {
        if (!cameraStream) {
            await initCameraStream();
        }
        gameScreen.style.display = "none";
        cameraScreen.style.display = "flex";
    } catch(error) {
        alert("Kamera-Fehler: " + error.message + "\nBitte prüfe die Berechtigungen deines Browsers.");
    }
}

function closeCamera(){
    cameraScreen.style.display = "none";
    gameScreen.style.display = "flex";
}

foundButton.addEventListener("click", function(){
    stopCamera();
    cameraScreen.style.display = "none";
    success.style.display = "flex";
});

function stopCamera(){
    if(cameraStream){
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
        camera.srcObject = null;
    }
}

againButton.addEventListener("click", function(){
    success.style.display = "none";
    gameScreen.style.display = "flex";

    startRadar();
    updateGame();
});

function calculateDistance(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const p1 = lat1 * Math.PI / 180;
    const p2 = lat2 * Math.PI / 180;
    const dp = (lat2-lat1) * Math.PI / 180;
    const dl = (lon2-lon1) * Math.PI / 180;

    const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function calculateBearing(lat1, lon1, lat2, lon2){
    const p1 = lat1 * Math.PI / 180;
    const p2 = lat2 * Math.PI / 180;
    const dl = (lon2-lon1) * Math.PI / 180;

    const y = Math.sin(dl) * Math.cos(p2);
    const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);

    return normalize(Math.atan2(y,x) * 180 / Math.PI);
}

function normalize(value){
    value = value % 360;
    if(value < 0) value += 360;
    return value;
}
</script>

</body>
</html>
