<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schnitzeljagd</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        #setup-container, #game-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #28a745;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #camera-preview {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 8px;
            margin-top: 15px;
            background: #000;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 1. ADRESSEINGABE (Startbildschirm) -->
    <div id="setup-container">
        <h2>Schnitzeljagd Starten</h2>
        <p>Gib das Ziel oder die Adresse ein:</p>
        <input type="text" id="target-address" placeholder="z. B. Marktplatz 1, Plochingen">
        <br>
        <button onclick="startGame()">Starten & Kamera aktivieren</button>
    </div>

    <!-- 2. SPIEL-OBERFLÄCHE (Kamera & GPS) -->
    <div id="game-container" class="hidden">
        <h3 id="display-target"></h3>
        
        <!-- Live-Videobild der Kamera -->
        <video id="camera-preview" autoplay playsinline></video>
        
        <p id="status-info">Suche Standort und Ausrichtung...</p>
    </div>

    <script>
        async function startGame() {
            const address = document.getElementById('target-address').value;
            if (!address) {
                alert('Bitte gib zuerst eine Adresse ein!');
                return;
            }

            document.getElementById('display-target').innerText = "Ziel: " + address;
            document.getElementById('setup-container').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');

            // Kamera-Freigabe anfordern
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } // Nutzt die Rückkamera
                });
                const videoElement = document.getElementById('camera-preview');
                videoElement.srcObject = stream;
            } catch (err) {
                alert("Kamera-Zugriff wurde nicht erlaubt oder wird nicht unterstützt: " + err.message);
            }

            // GPS-Standort abfragen
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        document.getElementById('status-info').innerText = 
                            `Aktueller Standort: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                    },
                    (error) => {
                        document.getElementById('status-info').innerText = "GPS-Fehler: " + error.message;
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                document.getElementById('status-info').innerText = "GPS wird von diesem Browser nicht unterstützt.";
            }
        }
    </script>
</body>
</html>
