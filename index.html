<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Radar</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #121212; color: white; text-align: center; }
        .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        #gameScreen, #cameraScreen, #success { display: none; }
        button { padding: 15px 25px; font-size: 16px; margin-top: 15px; cursor: pointer; background: #00e5ff; border: none; font-weight: bold; }
        #radar { width: 250px; height: 250px; border-radius: 50%; border: 2px solid #00e5ff; position: relative; margin: 20px auto; overflow: hidden; background: rgba(0,229,255,0.05); }
        #sweep, #sweepGlow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; pointer-events: none; }
        #sweep { background: conic-gradient(from 0deg, rgba(0,229,255,0.4), transparent 60deg); }
        #target { width: 12px; height: 12px; background: red; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); top: 50%; left: 50%; }
        #errorBox { color: #ff5252; background: #2a0000; padding: 10px; border-radius: 5px; display: none; margin-bottom: 15px; white-space: pre-line; }
        video { width: 100%; max-width: 400px; height: auto; }
    </style>
</head>
<body>

    <div id="startScreen" class="screen">
        <div id="errorBox"></div>
        <h1>GPS RADAR</h1>
        <button id="startButton">SPIEL STARTEN</button>
    </div>

    <div id="gameScreen" class="screen">
        <div id="status">SCHEIBE SCANNEN</div>
        <div id="radar">
            <div id="sweep"></div>
            <div id="sweepGlow"></div>
            <div id="target"></div>
        </div>
        <div>Entfernung: <span id="distance">-</span> m</div>
        <div id="accuracy">GPS-Genauigkeit: -</div>
        <div id="bearing">Zielrichtung: -</div>
        <button id="cameraButton" style="display:none;">KAMERA ÖFFNEN</button>
    </div>

    <div id="cameraScreen" class="screen">
        <video id="camera" autoplay playsinline></video>
        <button id="foundButton">ZIEL GEFUNDEN</button>
    </div>

    <div id="success" class="screen">
        <h1>HERZLICHEN GLÜCKWUNSCH!</h1>
        <button id="again">NOCH EINMAL</button>
    </div>

<script>
/* =====================================================
   ZIEL-EINSTELLUNGEN (DYNAMISCH)
===================================================== */
let TARGET_LAT = null;
let TARGET_LON = null;
const SPAWN_DISTANCE_METERS = 25;

/* =====================================================
   SPIEL-EINSTELLUNGEN
===================================================== */
const TARGET_RADIUS = 20;
const RADAR_RANGE = 500;

/* =====================================================
   VARIABLEN
===================================================== */
let gpsWatch = null;
let latitude = null;
let longitude = null;
let accuracy = null;
let targetBearing = 0;
let heading = 0;
let orientationAvailable = false;
let cameraStream = null;
let sweepAngle = 0;
let radarAnimation = null;

/* =====================================================
   ELEMENTE
===================================================== */
const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const cameraScreen = document.getElementById("cameraScreen");
const success = document.getElementById("success");

const startButton = document.getElementById("startButton");
const cameraButton = document.getElementById("cameraButton");
const foundButton = document.getElementById("foundButton");
const againButton = document.getElementById("again");

const errorBox = document.getElementById("errorBox");
const status = document.getElementById("status");
const distanceOutput = document.getElementById("distance");
const accuracyOutput = document.getElementById("accuracy");
const bearingOutput = document.getElementById("bearing");

const target = document.getElementById("target");
const radar = document.getElementById("radar");
const sweep = document.getElementById("sweep");
const sweepGlow = document.getElementById("sweepGlow");
const camera = document.getElementById("camera");

/* =====================================================
   ZIEL AUTOMATISCH NAHE ERZEUGEN
===================================================== */
function setDynamicTarget(userLat, userLon) {
    const metersPerDegree = 111000;
    const latOffset = SPAWN_DISTANCE_METERS / metersPerDegree;
    const lonOffset = SPAWN_DISTANCE_METERS / (metersPerDegree * Math.cos(userLat * Math.PI / 180));

    TARGET_LAT = userLat + (latOffset * 0.7);
    TARGET_LON = userLon + (lonOffset * 0.7);
}

/* =====================================================
   START
===================================================== */
startButton.addEventListener("click", startGame);

async function startGame(){
    hideError();
    startButton.disabled = true;
    startButton.textContent = "STANDORT WIRD FREIGEGEBEN ...";

    await askForOrientation();

    const gpsOK = await askForGPS();
    if(!gpsOK){
        startButton.disabled = false;
        startButton.textContent = "STANDORT ERNEUT FREIGEBEN";
        return;
    }

    startButton.textContent = "KAMERA WIRD FREIGEGEBEN ...";
    const cameraOK = await askForCamera();
    if(!cameraOK){
        startButton.disabled = false;
        startButton.textContent = "KAMERA ERNEUT FREIGEBEN";
        return;
    }

    startScreen.style.display = "none";
    gameScreen.style.display = "flex";

    startGPS();
    startRadar();
}

/* =====================================================
   GPS-BERECHTIGUNG
===================================================== */
function askForGPS(){
    return new Promise(function(resolve){
        if(!navigator.geolocation){
            showError("Dieses Gerät unterstützt keine Standortbestimmung.");
            resolve(false);
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position){
                latitude = position.coords.latitude;
                longitude = position.coords.longitude;
                accuracy = position.coords.accuracy;
                resolve(true);
            },
            function(error){
                if(error.code === 1){
                    showError("📍 Standortzugriff wurde verweigert.\n\nBitte erlaube dieser Website den Standortzugriff in den Browser-Einstellungen.");
                } else if(error.code === 2){
                    showError("📍 Standort konnte nicht ermittelt werden.\n\nBitte GPS/Standort einschalten.");
                } else {
                    showError("📍 GPS-Suche hat zu lange gedauert.\n\nBitte erneut versuchen.");
                }
                resolve(false);
            },
            { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
        );
    });
}

/* =====================================================
   KAMERA-BERECHTIGUNG
===================================================== */
async function askForCamera(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        showError("📷 Dieser Browser unterstützt keinen Kamerazugriff.");
        return false;
    }

    try{
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
        });
        stream.getTracks().forEach(track => track.stop());
        return true;
    } catch(error){
        showError("📷 Kamerazugriff wurde nicht erlaubt.\n\nBitte erlaube der Website den Kamerazugriff.");
        return false;
    }
}

/* =====================================================
   KOMPASS-BERECHTIGUNG
===================================================== */
async function askForOrientation(){
    try{
        if(typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
            const result = await DeviceOrientationEvent.requestPermission();
            if(result !== "granted"){
                orientationAvailable = false;
                return;
            }
        }
        window.addEventListener("deviceorientationabsolute", orientationHandler, true);
        window.addEventListener("deviceorientation", orientationHandler, true);
        orientationAvailable = true;
    } catch(error){
        orientationAvailable = false;
    }
}

/* =====================================================
   ORIENTIERUNG
===================================================== */
function orientationHandler(event){
    let value = null;
    if(typeof event.webkitCompassHeading === "number"){
        value = event.webkitCompassHeading;
    } else if(typeof event.alpha === "number"){
        value = 360 - event.alpha;
    }

    if(value !== null){
        heading = normalize(value);
        updateRadar();
    }
}

/* =====================================================
   GPS TRACKING
===================================================== */
function startGPS(){
    if(gpsWatch !== null){
        navigator.geolocation.clearWatch(gpsWatch);
    }
    status.textContent = "📡 GPS AKTIV";

    gpsWatch = navigator.geolocation.watchPosition(
        function(position){
            latitude = position.coords.latitude;
            longitude = position.coords.longitude;
            accuracy = position.coords.accuracy;

            if(TARGET_LAT === null || TARGET_LON === null){
                setDynamicTarget(latitude, longitude);
            }
            updateGame();
        },
        function(){
            status.textContent = "⚠️ GPS-SIGNAL VERLOREN";
        },
        { enableHighAccuracy:true, maximumAge:1000, timeout:15000 }
    );
}

/* =====================================================
   SPIEL BERECHNEN
===================================================== */
function updateGame(){
    if(latitude === null || longitude === null || TARGET_LAT === null || TARGET_LON === null) return;

    const distance = calculateDistance(latitude, longitude, TARGET_LAT, TARGET_LON);
    targetBearing = calculateBearing(latitude, longitude, TARGET_LAT, TARGET_LON);

    distanceOutput.textContent = Math.round(distance);
    accuracyOutput.textContent = "GPS-Genauigkeit: ±" + Math.round(accuracy) + " m";
    bearingOutput.textContent = "Zielrichtung: " + Math.round(targetBearing) + "°";

    if(distance <= TARGET_RADIUS){
        status.textContent = "🎯 ZIELBEREICH ERREICHT";
        cameraButton.style.display = "block";
    } else {
        status.textContent = "🔎 ZIEL SUCHEN";
        cameraButton.style.display = "none";
    }

    updateRadar();
}

/* =====================================================
   RADAR
===================================================== */
function updateRadar(){
    if(latitude === null || longitude === null || TARGET_LAT === null || TARGET_LON === null) return;

    const distance = calculateDistance(latitude, longitude, TARGET_LAT, TARGET_LON);
    const size = radar.clientWidth;
    const center = size / 2;

    let radius = (distance / RADAR_RANGE) * center;
    radius = Math.min(radius, center - 20);

    let angle = normalize(targetBearing - heading);
    const radians = angle * Math.PI / 180;

    target.style.left = (center + Math.sin(radians) * radius) + "px";
    target.style.top = (center - Math.cos(radians) * radius) + "px";

    if(!orientationAvailable){
        const northRadians = targetBearing * Math.PI / 180;
        target.style.left = (center + Math.sin(northRadians) * radius) + "px";
        target.style.top = (center - Math.cos(northRadians) * radius) + "px";
    }
}

/* =====================================================
   RADARSTRAHL
===================================================== */
function startRadar(){
    if(radarAnimation !== null){
        cancelAnimationFrame(radarAnimation);
        radarAnimation = null;
    }

    function animate(){
        sweepAngle += 1.6;
        if(sweepAngle >= 360) sweepAngle = 0;

        sweep.style.transform = "rotate(" + sweepAngle + "deg)";
        sweepGlow.style.transform = "rotate(" + sweepAngle + "deg)";

        radarAnimation = requestAnimationFrame(animate);
    }
    animate();
}

/* =====================================================
   KAMERA ÖFFNEN
===================================================== */
cameraButton.addEventListener("click", openCamera);

async function openCamera(){
    try{
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
        });
        camera.srcObject = cameraStream;
        gameScreen.style.display = "none";
        cameraScreen.style.display = "flex";
    } catch(error){
        showError("Die Kamera konnte nicht geöffnet werden.");
    }
}

/* =====================================================
   ZIEL GEFUNDEN
===================================================== */
foundButton.addEventListener("click", function(){
    stopCamera();
    cameraScreen.style.display = "none";
    success.style.display = "flex";
});

function stopCamera(){
    if(cameraStream){
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
        camera.srcObject = null;
    }
}

/* =====================================================
   NEUSTART
===================================================== */
againButton.addEventListener("click", function(){
    success.style.display = "none";
    gameScreen.style.display = "flex";
    cameraButton.style.display = "none";

    TARGET_LAT = null;
    TARGET_LON = null;

    startGPS();
    startRadar();
});

/* =====================================================
   MATHE-HILFSFUNKTIONEN
===================================================== */
function calculateDistance(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const p1 = lat1 * Math.PI / 180;
    const p2 = lat2 * Math.PI / 180;
    const dp = (lat2-lat1) * Math.PI / 180;
    const dl = (lon2-lon1) * Math.PI / 180;

    const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function calculateBearing(lat1, lon1, lat2, lon2){
    const p1 = lat1 * Math.PI / 180;
    const p2 = lat2 * Math.PI / 180;
    const dl = (lon2-lon1) * Math.PI / 180;

    const y = Math.sin(dl) * Math.cos(p2);
    const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);

    return normalize(Math.atan2(y,x) * 180 / Math.PI);
}

function normalize(value){
    value = value % 360;
    if(value < 0) value += 360;
    return value;
}

function showError(message){
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

function hideError(){
    errorBox.textContent = "";
    errorBox.style.display = "none";
}
</script>

</body>
</html>
